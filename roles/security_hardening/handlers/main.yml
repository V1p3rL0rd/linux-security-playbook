---
- name: Reload SSH
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: reloaded

- name: Restart Fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Apply sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: Reload auditd rules
  ansible.builtin.command:
    cmd: augenrules --load
  changed_when: true
