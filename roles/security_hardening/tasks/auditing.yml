---
- name: Install auditd and rsyslog (Debian/Ubuntu)
  when: ansible_os_family == 'Debian'
  ansible.builtin.apt:
    name:
      - rsyslog
      - auditd
      - lynis
    state: present

- name: Install audit and rsyslog (RedHat family)
  when: ansible_os_family == 'RedHat'
  ansible.builtin.dnf:
    name:
      - rsyslog
      - audit
      - lynis
    state: present

- name: Ensure rsyslog is enabled and started
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true

- name: Ensure auditd is enabled and started
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: Deploy baseline audit rules
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/99-security.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      ## Monitor changes to user/group databases
      -w /etc/passwd -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/gshadow -p wa -k identity
      -w /etc/security/opasswd -p wa -k identity

      ## Monitor changes to sudoers configuration
      -w /etc/sudoers -p wa -k sudoers
      -w /etc/sudoers.d/ -p wa -k sudoers

      ## Monitor system calls for date and time modification
      -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change
      -a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime -k time-change

      ## Monitor network environment configuration
      -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
      -a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/hosts -p wa -k system-locale
  notify: Reload auditd rules

- name: Run automated Lynis security audit scan
  when: security_run_lynis_audit | bool
  ansible.builtin.command:
    cmd: lynis audit system --quick --cronjob
  changed_when: false
  failed_when: false  # audit findings must not fail the play; report in /var/log/lynis-report.dat
