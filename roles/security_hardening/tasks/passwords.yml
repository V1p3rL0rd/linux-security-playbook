---
- name: Install libpam-pwquality (Debian/Ubuntu)
  when: ansible_os_family == 'Debian'
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present

- name: Enable pwquality module in PAM stack (Debian/Ubuntu)
  when: ansible_os_family == 'Debian'
  ansible.builtin.shell: |
    if grep -q 'pam_pwquality.so' /etc/pam.d/common-password; then
      exit 0
    fi
    pam-auth-update --enable pwquality
    echo CHANGED
  register: security_pam_debian
  changed_when: "'CHANGED' in security_pam_debian.stdout"

- name: Install libpwquality (RedHat family)
  when: ansible_os_family == 'RedHat'
  ansible.builtin.dnf:
    name: libpwquality
    state: present

- name: Enable pwquality feature in PAM with authselect (RedHat family)
  when: ansible_os_family == 'RedHat'
  ansible.builtin.shell: |
    if ! command -v authselect >/dev/null 2>&1; then
      exit 0
    fi
    if grep -q 'pam_pwquality.so' /etc/pam.d/system-auth 2>/dev/null; then
      exit 0
    fi
    authselect enable-feature with-pwquality
    authselect apply-changes
    echo CHANGED
  register: security_pam_redhat
  changed_when: "'CHANGED' in security_pam_redhat.stdout"

- name: Configure pwquality.conf
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
    content: |
      # Managed by Ansible (security_hardening role)
      minlen = {{ security_password_min_len }}
      minclass = {{ security_password_min_class }}
      maxrepeat = 3
      difok = 3
      gecoscheck = 1
      dcredit = -1
      ucredit = -1
      lcredit = -1
      ocredit = -1

- name: Configure password expiration and umask in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.param }}\\s"
    line: "{{ item.param }} {{ item.val }}"
    state: present
    backup: true
  loop:
    - { param: "PASS_MAX_DAYS", val: "{{ security_password_max_days }}" }
    - { param: "PASS_MIN_DAYS", val: "{{ security_password_min_days }}" }
    - { param: "PASS_WARN_AGE", val: "{{ security_password_warn_age }}" }
    - { param: "UMASK", val: "{{ security_umask }}" }

# Only human accounts (UID >= UID_MIN, login shell) that have a usable password
# hash. Locked/key-only accounts (hash starts with '!' or '*', e.g. cloud users
# like ubuntu/ec2-user) are skipped: expiring them would force a password change
# on key-based SSH login and break non-interactive access (incl. Ansible).
# Users already matching the policy are skipped, so the task is idempotent.
- name: Find human users whose password aging differs from policy
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      uid_min=$(awk '/^UID_MIN/ {print $2; f=1} END {if (!f) print 1000}' /etc/login.defs)
      awk -F: -v min="$uid_min" \
          -v pmin="{{ security_password_min_days }}" \
          -v pmax="{{ security_password_max_days }}" \
          -v pwarn="{{ security_password_warn_age }}" '
        NR == FNR {
          if ($2 !~ /^[!*]/ && $2 != "" && ($4 != pmin || $5 != pmax || $6 != pwarn)) need[$1] = 1
          next
        }
        $3 >= min && $1 != "nobody" && $7 !~ /(nologin|false)$/ && ($1 in need) { print $1 }
      ' /etc/shadow /etc/passwd
  register: security_regular_users
  changed_when: false

- name: Apply password expiration to existing human users
  ansible.builtin.command:
    cmd: >-
      chage --maxdays {{ security_password_max_days }}
      --mindays {{ security_password_min_days }}
      --warndays {{ security_password_warn_age }} {{ item }}
  loop: "{{ security_regular_users.stdout_lines }}"
  when: item not in security_password_expiry_exclude_users
  changed_when: true
