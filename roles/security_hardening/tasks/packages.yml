---
- name: Update apt cache and upgrade packages (Debian/Ubuntu)
  when: ansible_os_family == 'Debian'
  ansible.builtin.apt:
    update_cache: true
    upgrade: "{{ 'dist' if security_upgrade_all_packages | bool else 'no' }}"
    cache_valid_time: 3600

- name: Install EPEL repo (AlmaLinux / Rocky / CentOS Stream)
  when:
    - ansible_os_family == 'RedHat'
    - ansible_distribution in ['AlmaLinux', 'Rocky', 'CentOS']
  ansible.builtin.dnf:
    name: epel-release
    state: present

# epel-release is not shipped in RHEL repositories; install it from Fedora.
- name: Install EPEL repo (RHEL)
  when: ansible_distribution == 'RedHat'
  block:
    - name: Import EPEL GPG key (RHEL)
      ansible.builtin.rpm_key:
        key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_distribution_major_version }}"
        state: present

    - name: Install epel-release package (RHEL)
      ansible.builtin.dnf:
        name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present

- name: Upgrade all packages (RedHat family)
  when:
    - ansible_os_family == 'RedHat'
    - security_upgrade_all_packages | bool
  ansible.builtin.dnf:
    name: "*"
    state: latest  # noqa: package-latest -- full upgrade is intentional, toggle via security_upgrade_all_packages
